
name: Build Desert Diner Core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Forge 1.20.1 Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract source archive
        run: |
          unzip -q Last_Stop_Desert_Diner_Stage2_0.2.0_Source.zip -d source

      - name: Build mod
        working-directory: ./source/Desert_Diner_Core_0.2.0
        run: gradle build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: desert-diner-core-0.2.0
          path: source/Desert_Diner_Core_0.2.0/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
