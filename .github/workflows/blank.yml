
name: Build Garage Auction v2.1

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o GarageAuction-Park-Scrapyard-v2-fixed.zip -d extracted

      - name: Compile mod
        working-directory: extracted/GarageAuctionPack
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: GarageAuction-v2.1
          path: extracted/GarageAuctionPack/build/libs/*.jar
          if-no-files-found: error
