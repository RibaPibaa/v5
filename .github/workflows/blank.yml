
name: Build Tactical Arena

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Tactical Arena Forge 1.20.1
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source and locate Gradle project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="$GITHUB_WORKSPACE/_tacticalarena_source"

          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            SOURCE_DIR="$GITHUB_WORKSPACE"
            echo "Gradle project found in repository root."
          else
            ARCHIVE=""

            if [ -f "TacticalArena-0.3.0-dev-FULL-PROJECT.zip" ]; then
              ARCHIVE="TacticalArena-0.3.0-dev-FULL-PROJECT.zip"
            else
              ARCHIVE=$(find . -maxdepth 1 -type f \
                -iname 'TacticalArena*.zip' \
                | sort -V | tail -n 1 || true)
            fi

            if [ -z "$ARCHIVE" ] || [ ! -f "$ARCHIVE" ]; then
              echo "::error::Tactical Arena ZIP archive not found!"
              ls -la
              exit 1
            fi

            echo "Using archive: $ARCHIVE"

            unzip -t "$ARCHIVE"

            rm -rf "$SOURCE_DIR"
            mkdir -p "$SOURCE_DIR"
            unzip -oq "$ARCHIVE" -d "$SOURCE_DIR"
          fi

          PROJECT_FILE=$(find "$SOURCE_DIR" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.gradle/*" \
            -not -path "*/build/*" \
            | sort | head -n 1 || true)

          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find "$SOURCE_DIR" \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -not -path "*/.gradle/*" \
              -not -path "*/build/*" \
              | sort | head -n 1 || true)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::Gradle project not found!"
            find "$SOURCE_DIR" -maxdepth 6 -type f | head -n 300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          if [ ! -d "$PROJECT_DIR/src/main/java" ]; then
            echo "::error::Java source directory not found!"
            find "$PROJECT_DIR" -maxdepth 4 -type f
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "--------------------------------"
          echo "Gradle project found:"
          echo "$PROJECT_DIR"
          echo "--------------------------------"

          ls -la "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Verify environment
        run: |
          java -version
          gradle --version

      - name: Build Tactical Arena
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            echo "Using Gradle Wrapper."
            chmod +x ./gradlew
            ./gradlew --no-daemon clean build --stacktrace
          else
            echo "Using installed Gradle 8.8."
            gradle --no-daemon clean build --stacktrace
          fi

      - name: Verify generated JAR
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if ! find build/libs -maxdepth 1 -type f -name '*.jar' \
            -print -quit | grep -q .; then
            echo "::error::No JAR file was generated!"
            exit 1
          fi

          echo "Generated JAR:"
          ls -lh build/libs/*.jar

      - name: Upload Tactical Arena JAR
        uses: actions/upload-artifact@v4
        with:
          name: TacticalArena-Forge-1.20.1
          path: ${{ steps.locate.outputs.project_dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TacticalArena-build-reports
          path: |
            _tacticalarena_source/**/build/reports/
            _tacticalarena_source/**/build/test-results/
            build/reports/
          if-no-files-found: ignore
          retention-days: 7
