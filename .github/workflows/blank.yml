
name: Build Desert Diner Core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Forge 1.20.1 Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Find project and build
        shell: bash
        run: |
          PROJECT_FILE=$(find . -type f -name "settings.gradle" -not -path "./.git/*" -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle was not found!"
            echo "Repository contents:"
            ls -la
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Found Gradle project: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          if [ ! -f build.gradle ]; then
            echo "ERROR: build.gradle was not found in $PROJECT_DIR"
            exit 1
          fi

          gradle build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: desert-diner-core-0.2.0
          path: '**/build/libs/desert-diner-core-0.2.0.jar'
          if-no-files-found: error
          retention-days: 14
