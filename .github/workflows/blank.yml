
name: Build Tactical Arena

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Tactical Arena Forge 1.20.1
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract Tactical Arena
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="TacticalArena-GitHub-root.zip"
          SOURCE_DIR="$GITHUB_WORKSPACE/_tacticalarena_source"

          if [ -f "$ARCHIVE" ]; then
            echo "Found source archive: $ARCHIVE"

            unzip -t "$ARCHIVE"
            rm -rf "$SOURCE_DIR"
            mkdir -p "$SOURCE_DIR"
            unzip -oq "$ARCHIVE" -d "$SOURCE_DIR"

            echo "Archive extracted."
          elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            SOURCE_DIR="$GITHUB_WORKSPACE"
            echo "Using Gradle project from repository root."
          else
            echo "::error::Neither source ZIP nor root Gradle project found!"
            ls -la
            exit 1
          fi

          PROJECT_FILE=$(find "$SOURCE_DIR" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.gradle/*" \
            | head -n 1 || true)

          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find "$SOURCE_DIR" \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -not -path "*/.gradle/*" \
              | head -n 1 || true)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::Gradle project not found!"
            find "$SOURCE_DIR" -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          if [ ! -d "$PROJECT_DIR/src/main/java" ]; then
            echo "::error::Java source directory not found!"
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Project directory: $PROJECT_DIR"
          echo "Project files:"
          ls -la "$PROJECT_DIR"

      - name: Verify build environment
        run: |
          java -version
          gradle --version

      - name: Build Tactical Arena
        working-directory: ${{ steps.extract.outputs.dir }}
        run: gradle --no-daemon clean build --stacktrace

      - name: Show generated JAR
        working-directory: ${{ steps.extract.outputs.dir }}
        run: |
          echo "Build output:"
          ls -lh build/libs/

      - name: Upload Tactical Arena JAR
        uses: actions/upload-artifact@v4
        with:
          name: TacticalArena-Forge-1.20.1
          path: ${{ steps.extract.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TacticalArena-build-reports
          path: |
            _tacticalarena_source/**/build/reports/
            build/reports/
          if-no-files-found: ignore
          retention-days: 7
